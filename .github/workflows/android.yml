name: Build SIN KARM1S Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Locate project
        id: locate
        run: |
          if [ -f package.json ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f sin_karm1s_android/package.json ]; then
            echo "dir=sin_karm1s_android" >> "$GITHUB_OUTPUT"
          else
            echo "package.json tidak ditemukan"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.dir }}
        run: npm install

      - name: Test project
        working-directory: ${{ steps.locate.outputs.dir }}
        run: npm test --if-present

      - name: Generate Android
        working-directory: ${{ steps.locate.outputs.dir }}
        run: npm run android:add

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIN-KARM1S-Android-debug-apk
          path: ${{ steps.locate.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
